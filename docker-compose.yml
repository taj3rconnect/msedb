services:
  msedb-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: msedb-backend
    ports:
      - "8010:8010"
    env_file:
      - .env
    depends_on:
      msedb-mongo:
        condition: service_healthy
      msedb-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - msedb-network
      - ax1-network # AX1 Qdrant (loopback-bound on host; reachable only container-to-container)
    volumes:
      - msedb-logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  msedb-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: msedb-frontend
    ports:
      - "3010:8080"
      - "127.0.0.1:3011:8081"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./addin/dist:/usr/share/nginx/addin:ro
    depends_on:
      msedb-backend:
        condition: service_healthy
    networks:
      - msedb-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

  msedb-mongo:
    image: mongo:8.2
    container_name: msedb-mongo
    ports:
      - "27020:27017"
    volumes:
      - msedb-mongo-data:/data/db
    networks:
      - msedb-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  msedb-redis:
    image: redis:8-alpine
    container_name: msedb-redis
    ports:
      - "6382:6379"
    volumes:
      - msedb-redis-data:/data
    networks:
      - msedb-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # No auth by design (REDIS_PASSWORD unused). Backend connects with no password
    # (config.redisPassword '' → undefined → no AUTH), so requiring one here would
    # mismatch and break the connection. Keep redis + backend + healthcheck all no-auth.
    # aof-load-corrupt-tail-max-size: tolerate a torn AOF tail on load instead of
    # refusing to start. On 2026-08-08 a 872-byte torn tail in
    # appendonly.aof.2559.incr.aof put this container in a 265-restart crash loop
    # that stalled all 11 BullMQ queues and held /api/health at 503. Redis's own
    # error message suggests the exact remaining-byte count (872), but that value
    # is an exact fit and did NOT clear the error — 4096 gives the framing headroom
    # it actually needs. Recovery is lossy by design: Redis discards the corrupt
    # tail (a few writes), which is safe here because MongoDB is the system of
    # record and BullMQ jobs are replayable.
    command: ["redis-server", "--appendonly", "yes", "--aof-load-corrupt-tail-max-size", "4096", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # msedb-tunnel removed — routes merged into host tunnel (/etc/cloudflared/config.yml)

networks:
  msedb-network:
    driver: bridge
    name: msedb-network
  ax1-network:
    external: true
    name: ax1_default

volumes:
  msedb-mongo-data:
    name: msedb-mongo-data
  msedb-redis-data:
    name: msedb-redis-data
  msedb-logs:
    name: msedb-logs
